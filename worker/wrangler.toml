# worker/wrangler.toml — 星宇票價趨勢推播服務（Phase 2 / T8）
# ---------------------------------------------------------------------------------------------
# 部署步驟詳見 worker/README.md（wrangler login → KV namespace → VAPID 金鑰 → secrets → deploy）
# 對照：docs/development/PWA.md §9.1（本檔為其實作版）
name = "airtickets-price-push"
main = "src/index.js"
compatibility_date = "2026-08-15"

[vars]
# 公開 VAPID 公鑰（raw point base64url，87 chars、0x04 開頭）：
#   產生：node worker/spike/gen-vapid-keys.mjs → 輸出 publicKey
#   用途：GET /vapid-public-key 回傳、前端 PushManager.subscribe(applicationServerKey) 用同一值
#   ⚠️ 此為 placeholder——部署前必須以實際產出值替換（勿 commit 測試金鑰）
VAPID_PUBLIC_KEY = "BLR37tYlifEmx-pybUsAHHnAbg4vtkuZGK-951g-vvGQdVnaYQEFSPRYnvBpQsBO7KqlEqt_-DxKkrihXxKCifE"

# VAPID JWT 的 sub 宣告（mailto: 或 https:；RFC 8292 SHOULD；可任意 email）
VAPID_SUBJECT = "mailto:admin@example.com"

[[kv_namespaces]]
# 訂閱名單（key = sub:{endpoint}，value = PushSubscription JSON；HDL-10 裝置單位）
#   建立：wrangler kv namespace create SUBSCRIPTIONS → 以輸出的 id 替換下方 placeholder
binding = "SUBS"
id = "c826435583dc465394ea302b19e38293"

# 機密（不寫入本檔，以 wrangler secret put 設定，詳見 README）：
#   VAPID_PRIVATE_KEY  = gen-vapid-keys.mjs 輸出的 privateKeyJwk JSON 字串（EC P-256 JWK 含 d）
#   PUSH_API_TOKEN     = 與 GitHub Actions repo secret 同值（爬蟲 → Worker 共用；/subscribe 與 /notify 皆驗）
