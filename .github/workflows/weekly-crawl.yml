name: weekly-price-crawl

on:
  schedule:
    # 每週五 09:00 (UTC+8) = 01:00 UTC
    - cron: "0 1 * * 5"
  workflow_dispatch: # 也可手動觸發

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許把 data/ 提交回 repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cron jitter（隨機延遲 0~30 分，避免固定整點模式）
        run: python -c "import random,time; time.sleep(random.uniform(0, 1800))"

      - name: Crawl prices
        run: python fetch_prices.py

      - name: Build static API
        run: python build_api.py

      - name: Commit data & api
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ api/
          if git diff --cached --quiet; then
            echo "無變更，跳過 commit"
          else
            git commit -m "chore: 更新機票價格 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
