name: weekly-price-crawl

on:
  schedule:
    # 每週五 09:00 (UTC+8) = 01:00 UTC
    - cron: "0 1 * * 5"
  workflow_dispatch:
    inputs:
      skip_crawl:
        description: '只更新網頁，不爬取新資料'
        required: false
        default: 'false'
        type: boolean

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許把 data/ 提交回 repo
    env:
      PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cron jitter（隨機延遲 0~30 分，避免固定整點模式）
        # 只有排程觸發才延遲；手動執行（workflow_dispatch）不需打亂節奏，立即開始
        if: github.event_name == 'schedule'
        run: python -c "import random,time; time.sleep(random.uniform(0, 1800))"

      - name: Crawl prices
        if: inputs.skip_crawl != 'true'
        run: python fetch_prices.py

      - name: Build static API
        if: inputs.skip_crawl != 'true'
        run: python build_api.py

      - name: Commit data
        if: inputs.skip_crawl != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "無變更，跳過 commit"
          else
            git commit -m "chore: 更新機票價格 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Detect drops & notify（PWA Phase 2；需先設定 PUSH_API_TOKEN secret）
        # 位於 Commit 之後（規格 §9.2）：① 基準讀「上一週 data 檔」不受本次 build 汙染；
        # ② E6「資料照常提交」語意成立——通知失敗不影響已 commit 的資料。
        # 失敗語意：不需 continue-on-error——step 失敗只讓 workflow 標紅（提示需人工查看，
        # 如 token 輪換／Worker 異常），爬蟲結果仍已照常提交。
        # 未設定 PUSH_API_TOKEN → shell 條件跳過、不報錯（維持「無 secret 也能跑」）。
        # 注意：secrets / env context 皆不能用於 if: 條件（GitHub Actions 解析限制，
        # 前者報 Unrecognized named-value: 'secrets'）→ 改以 shell 判斷 + job 級 env 注入。
        if: inputs.skip_crawl != 'true'
        env:
          PUSH_NOTIFY_URL: https://airtickets-price-push.h770320.workers.dev/notify  # 部署後改為實際網域
        run: |
          if [ -n "$PUSH_API_TOKEN" ]; then
            python fetch_prices.py --notify
          else
            echo "未設定 PUSH_API_TOKEN，跳過通知（Settings → Secrets and variables → Actions 可設定）"
          fi

      # Pages 部署：api/ 已加入 .gitignore，不進版控，建置後直接部署
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r web/* _site/
          if [ "${{ inputs.skip_crawl }}" != "true" ]; then
            cp -r api   _site/
          else
            echo "跳過 API 資料，僅更新前端"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
