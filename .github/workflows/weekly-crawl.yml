name: weekly-price-crawl

on:
  schedule:
    # 每週五 09:00 (UTC+8) = 01:00 UTC
    - cron: "0 1 * * 5"
  workflow_dispatch: # 也可手動觸發

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許把 data/ 提交回 repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Cron jitter（隨機延遲 0~30 分，避免固定整點模式）
        # 只有排程觸發才延遲；手動執行（workflow_dispatch）不需打亂節奏，立即開始
        if: github.event_name == 'schedule'
        run: python -c "import random,time; time.sleep(random.uniform(0, 1800))"

      - name: Crawl prices
        run: python fetch_prices.py

      - name: Build static API
        run: python build_api.py

      - name: Commit data & api
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ api/
          if git diff --cached --quiet; then
            echo "無變更，跳過 commit"
          else
            git commit -m "chore: 更新機票價格 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Detect drops & notify（PWA Phase 2；需先設定 PUSH_API_TOKEN secret）
        # 位於 Commit 之後（規格 §9.2）：① 基準讀「上一週 data 檔」不受本次 build 污染；
        # ② E6「資料照常提交」語意成立——通知失敗不影響已 commit 的資料。
        # 失敗語意：不需 continue-on-error——step 失敗只讓 workflow 標紅（提示需人工查看，
        # 如 token 輪換／Worker 異常），爬蟲結果仍已照常提交。
        if: ${{ secrets.PUSH_API_TOKEN != '' }}   # 未設定 secret → 整步跳過、不報錯（維持「無 secret 也能跑」）
        env:
          PUSH_API_TOKEN: ${{ secrets.PUSH_API_TOKEN }}
          PUSH_NOTIFY_URL: https://airtickets-price-push.<account>.workers.dev/notify  # 部署後改為實際網域
        run: python fetch_prices.py --notify
