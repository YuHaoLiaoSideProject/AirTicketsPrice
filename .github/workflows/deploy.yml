name: deploy-pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'data/**', 'build_api.py']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build static API
        run: python build_api.py

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r api _site/
          cd web && find . -mindepth 1 -maxdepth 1 ! -name api -exec cp -r {} ../_site/ \;

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
